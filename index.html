<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Brass Band - Lilongwe</title>

    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; }
       body { font-family: Arial, sans-serif; background: #800000;}
       
       .topbar {
        background: #800000;
        color: white;
        padding: 15px 20px;
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        justify-content: space-between;
        text-align: center;
        border-bottom: none;
       }

       .topbar a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
        font-size: 0.95rem;
       }

       .topbar a.active { border-bottom: 2px solid #FFD700; font-weight: bold;} /*Gold underline*/ 
        
       .container {
        min-height: calc(100vh - 55px);
        padding: 0 15px;
        border: 2px solid #800000;
        border-top: none;
        border-radius: 0 0 12px 12px;
       }

       .hero {
        background-image: linear-gradient(rgba(128, 0, 0, 0.6), rgba(128, 0, 0, 0.6)), url('images/BLSSM-0795.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        height: 100vh;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        margin: 0;
        position: relative;
        width: 100%;
       }

       .hero h1 { font-size: 2.2rem; color: #FFD700; margin: 10px;}

       .hero p { font-size: 1.1rem; margin-bottom: 30px;}

       .btn {
        background-color: #800000;
        color: #FFD700;
        padding: 15px 30px;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 1.1rem;
        border: 2px solid #FFD700;
       }
        </style>
</head>
<body>

    <nav class="topbar">
        <div class="logo">Our Brass Band</div>
        <div>
            <a href="idex.html" class="active">HOME</a> <!--active means you on this page -->
            <a href="terms.html">T&C</a>
            <a href="booking.html">Book</a> 
            </div>
        </nav>
  
    <section class="hero">
      <h1>Our Brass Band</h1>
      <p>Lilongwe's #1 Brass Band for any event of your choice</p>
      <a href="booking.html" class="btn">Check Dates & Book Now</a>
    </section> 
</body>
</html>
